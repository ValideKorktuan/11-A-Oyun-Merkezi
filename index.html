<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0e1630"><meta http-equiv="Cache-Control" content="no-cache">
<title>Oyun Merkezi</title>
<style>
:root{--bg:#0e1630;--panel:#15203f;--line:#33427a;--ink:#fdf3e3;--mut:#c9b8a6;--acc:#ffc857;--ok:#7be0a4;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:flex;justify-content:center;padding:16px}
main{width:100%;max-width:560px}
h1{font-size:28px;margin:0 0 12px}
h2{font-size:20px;margin:0}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;background:var(--panel);color:var(--mut);border:1px solid var(--line)}
.tab.on{background:var(--acc);color:#1d2b53;border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;color:var(--ink);font-weight:normal}
.card b{display:block;font-size:19px;margin:6px 0 2px}
.card span{font-size:13px;color:var(--mut)}
.card i{font-style:normal;font-size:30px}
.k .card{border-color:#6b3b4a}
button{font:inherit;font-size:17px;font-weight:bold;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;background:var(--acc);color:#1d2b53}
button:disabled{opacity:.45;cursor:not-allowed}
button.out{background:var(--ok)}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--mut);font-size:14px;font-weight:normal;padding:7px 12px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.panel{background:var(--panel);border-radius:14px;padding:14px;margin-top:12px}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:10px}
.row>*{flex:1;min-width:110px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:4px}
input[type=number]{font:inherit;font-size:18px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.msg{min-height:22px;margin-top:10px;font-size:15px;text-align:center}
.stage{position:relative;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,#1d2b53,#e8836b);aspect-ratio:4/3}
.stage canvas{width:100%;height:100%;display:block}
#mult{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:bold;pointer-events:none;text-shadow:0 2px 12px rgba(0,0,0,.4)}
#mult.crash{color:var(--bad)}
.big{font-size:56px;text-align:center;margin:14px 0}
.hist{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{padding:3px 9px;border-radius:99px;font-size:13px;background:#243263}
.chip.hi{color:var(--ok)}.chip.lo{color:var(--bad)}
canvas.sn{width:100%;max-width:400px;display:block;margin:0 auto;background:#0a1124;border-radius:12px;touch-action:none}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mem button{font-size:32px;aspect-ratio:1;padding:0;background:#243263;color:var(--ink)}
.mem button.up{background:var(--ink)}
.mem button.done{background:var(--ok)}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:0 auto}
.ttt button{font-size:40px;aspect-ratio:1;padding:0;background:#243263;color:var(--ink)}
.ref{height:200px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;user-select:none;text-align:center;padding:10px;color:#101010}
.acct{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 12px;font-size:15px}
.acct span{flex:1}
[hidden]{display:none!important}
input[type=text],input[type=password]{font:inherit;font-size:17px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.note{font-size:12px;color:var(--mut);margin-top:12px}

body{background:radial-gradient(110% 70% at 50% -10%,#35498f 0%,#16224a 45%,#0b1226 100%) fixed}
body::before,body::after{content:"";position:fixed;left:-30%;width:160%;height:160px;pointer-events:none;opacity:.55;background:radial-gradient(ellipse 120px 28px at 10% 50%,rgba(255,255,255,.1),transparent 70%),radial-gradient(ellipse 160px 34px at 45% 40%,rgba(255,255,255,.08),transparent 70%),radial-gradient(ellipse 100px 24px at 80% 60%,rgba(255,255,255,.09),transparent 70%);animation:drift 70s linear infinite}
body::before{top:12%}body::after{top:58%;animation-duration:100s;animation-direction:reverse}
@keyframes drift{to{transform:translateX(30%)}}
main{position:relative;z-index:1}
h1{display:flex;align-items:center;gap:10px}
button{position:relative;overflow:hidden;transition:transform .12s,box-shadow .2s,filter .2s,background .25s,color .25s;box-shadow:0 4px 0 rgba(0,0,0,.28)}
button:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(3px) scale(.97);box-shadow:0 1px 0 rgba(0,0,0,.28)}
button.ghost,.card,.tab,.mem button,.ttt button{box-shadow:none}
.tab:hover:not(.on){background:#1d2b55}
.card{background:linear-gradient(160deg,#1b2a55,#121b3a);transition:transform .2s,border-color .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);border-color:var(--acc);box-shadow:0 12px 24px rgba(0,0,0,.35)}
.card:active:not(:disabled){transform:scale(.95)}
.k .card:hover{border-color:var(--bad)}
.card i{display:inline-flex;width:54px;height:54px;align-items:center;justify-content:center;border-radius:15px;background:rgba(255,255,255,.08);transition:transform .25s}
.card:hover i{transform:rotate(-8deg) scale(1.12)}
.grid .card{animation:rise .45s both}
.grid .card:nth-child(2){animation-delay:.07s}.grid .card:nth-child(3){animation-delay:.14s}.grid .card:nth-child(4){animation-delay:.21s}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.95)}}
#view>*{animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.panel{border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.stage{box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.12)}
input:focus{outline:none;border-color:var(--acc)!important;box-shadow:0 0 0 3px rgba(255,200,87,.2)}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.bv.bump{display:inline-block;animation:bump .45s}
@keyframes bump{40%{transform:scale(1.5);color:#7be0a4}}
.fl{position:fixed;z-index:60;font-weight:bold;font-size:20px;pointer-events:none;animation:fl 1s ease-out forwards;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.fl.up{color:#7be0a4}.fl.dn{color:#ff6b6b}
@keyframes fl{to{transform:translateY(-46px);opacity:0}}
.coin{width:110px;height:110px;margin:22px auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:bold;color:#7a5200;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc857 55%,#c98b12);box-shadow:inset 0 0 0 6px rgba(255,255,255,.25),0 8px 20px rgba(0,0,0,.4)}
.coin.spin{animation:cspin .7s ease-in-out}
@keyframes cspin{0%{transform:translateY(0) rotateY(0)}50%{transform:translateY(-70px) rotateY(900deg)}100%{transform:translateY(0) rotateY(1800deg)}}
#dice{font-variant-numeric:tabular-nums;font-size:54px;font-weight:bold}
#dice.rolling{animation:shake .12s infinite;color:var(--acc)}
@keyframes shake{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.track{position:relative;height:14px;border-radius:99px;background:#8ecbff;margin:4px 0 12px}
.track i{position:absolute;left:0;top:0;bottom:0;width:50%;background:var(--acc);border-radius:99px 0 0 99px;transition:width .2s}
.track b{position:absolute;top:-5px;left:50%;width:4px;height:24px;margin-left:-2px;border-radius:2px;background:#fff;box-shadow:0 0 8px #fff;transition:left .05s}
.mem button{transition:background .2s,transform .15s}
.mem button.flip{animation:flip .26s}
@keyframes flip{50%{transform:rotateY(90deg)}}
.mem button.done{animation:donep .4s}
@keyframes donep{50%{transform:scale(1.15)}}
.ttt button.pop{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0)}}
.ttt button.x{color:var(--acc)}.ttt button.o{color:var(--ok)}
.ref{transition:background .15s,transform .1s}.ref:active{transform:scale(.98)}
#mult.crash{animation:shake .08s 5}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.hud{display:flex;justify-content:center;gap:12px;margin-bottom:10px;font-size:19px;font-weight:bold}
.hud span{background:#4a752c;color:#fff;border-radius:99px;padding:5px 16px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
canvas.sn{box-shadow:0 10px 30px rgba(0,0,0,.4);background:#aad751}
.stage.shk{animation:shk .45s}
@keyframes shk{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,3px)}}
.csh{width:80px;height:12px;border-radius:50%;background:rgba(0,0,0,.35);margin:-8px auto 10px;filter:blur(2px)}
.csh.spin{animation:csh .7s ease-in-out}
@keyframes csh{50%{transform:scale(.45);opacity:.4}}
.coin.win{animation:cwin .9s ease-in-out infinite alternate}
@keyframes cwin{to{box-shadow:inset 0 0 0 6px rgba(255,255,255,.25),0 0 30px #ffc857}}
.coin.y{background:radial-gradient(circle at 35% 30%,#fff,#d6dbe8 55%,#8f98b3);color:#46506e}
#dice.wn{animation:wn .5s;color:var(--ok)}
#dice.ls{animation:no .4s;color:var(--bad)}
@keyframes wn{50%{transform:scale(1.35)}}
.track{box-shadow:inset 0 2px 5px rgba(0,0,0,.3)}
.mem{perspective:800px}
.mem button{background:repeating-linear-gradient(45deg,#2f4086 0 7px,#263472 7px 14px);border:2px solid #3b4c92;border-radius:12px}
.mem button.up{background:#fdf3e3}
.mem button.done{background:#7be0a4;box-shadow:0 0 14px rgba(123,224,164,.6)}
.mem button.no{background:#ffd0d0;animation:no .4s}
.mem button.flip{animation:flip3 .3s}
@keyframes flip3{50%{transform:rotateY(90deg)}}
@keyframes no{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ttt button{background:#1c2a5c;border:2px solid #33427a;border-radius:14px;font-size:46px;font-weight:bold;box-shadow:inset 0 3px 8px rgba(0,0,0,.35)}
.ttt button:hover:not(.x):not(.o){background:#2a3b7a}
.ttt button.w{animation:glow .7s ease-in-out infinite alternate;background:#2f4a8a}
@keyframes glow{to{box-shadow:0 0 18px var(--ok),inset 0 0 12px rgba(123,224,164,.5);transform:scale(1.06)}}
.ref{box-shadow:inset 0 0 0 3px rgba(255,255,255,.25);font-weight:bold;font-size:24px}
.ref.wt{animation:wtp 1s ease-in-out infinite}
@keyframes wtp{50%{transform:scale(.985);filter:brightness(.9)}}
.ref.go{animation:gop .45s;box-shadow:0 0 30px rgba(123,224,164,.7)}
@keyframes gop{from{transform:scale(.9)}50%{transform:scale(1.04)}}

html{-webkit-tap-highlight-color:transparent;scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));-webkit-font-smoothing:antialiased}
h1{font-size:30px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(90deg,#fff,#ffc857 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 svg{filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));animation:flt 4s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-3px) rotate(-3deg)}}
button{touch-action:manipulation;user-select:none;-webkit-user-select:none;background:linear-gradient(180deg,#ffd77a,#ffc857);letter-spacing:.2px}
button.out{background:linear-gradient(180deg,#98efbb,#7be0a4)}
button.ghost{background:rgba(255,255,255,.04);backdrop-filter:blur(6px)}
button.ghost:hover:not(:disabled){border-color:var(--acc);color:var(--ink)}
.tabs{background:rgba(0,0,0,.25);padding:5px;border-radius:14px;border:1px solid var(--line)}
.tab{border:0;background:transparent;box-shadow:none!important}
.tab.on{background:linear-gradient(180deg,#ffd77a,#ffc857);box-shadow:0 4px 14px rgba(255,200,87,.35)!important}
.card{border-radius:18px;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.09) 50%,transparent 60%);transform:translateX(-100%);transition:transform .6s}
.card:hover::after{transform:translateX(100%)}
.card b{font-weight:700}
.panel{background:rgba(21,32,63,.75);backdrop-filter:blur(10px);border-radius:18px}
.acct{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.stage,canvas.sn{border-radius:18px}
canvas.sn{will-change:transform;box-shadow:0 14px 36px rgba(0,0,0,.45),0 0 0 3px #4a752c}
.hud span{background:linear-gradient(180deg,#5c9138,#3f6a25);font-variant-numeric:tabular-nums}
.msg{transition:opacity .2s}
.note{text-align:center;opacity:.7}
::selection{background:var(--acc);color:#1d2b53}
@media (max-width:380px){h1{font-size:25px}.card{padding:13px}}

.g48{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#0a1124;padding:8px;border-radius:18px;max-width:400px;margin:0 auto;touch-action:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.g48 div{aspect-ratio:1;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;color:#1d2b53;background:rgba(255,255,255,.06)}
.mn{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-width:400px;margin:0 auto}
.mn button{aspect-ratio:1;padding:0;font-size:17px;border-radius:8px;background:linear-gradient(#3a4c99,#2a3978);color:#fff;box-shadow:none}
.mn button.o{background:#16224a;color:var(--acc)}
.slt{display:flex;gap:10px;justify-content:center;margin:16px 0;padding:14px;background:linear-gradient(#5a3b0e,#2b1a05);border-radius:18px;box-shadow:inset 0 0 0 3px #ffc857}
.slt b{width:84px;height:96px;font-size:52px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#fdf3e3,#cfd6ea 50%,#fdf3e3);border-radius:12px;box-shadow:inset 0 6px 14px rgba(0,0,0,.35)}
.slt b.spn{animation:rl .09s linear infinite;filter:blur(1.5px)}
@keyframes rl{50%{transform:translateY(6px)}}
.rw{position:relative;width:min(300px,100%);margin:14px auto}
.rw canvas{width:100%;display:block;border-radius:50%;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform 4s cubic-bezier(.12,.6,.1,1)}
.rp{position:absolute;top:-10px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:18px solid #ffc857;z-index:2;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.mg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:360px;margin:0 auto}
.mg button{aspect-ratio:1;padding:0;font-size:28px;background:linear-gradient(#3a4c99,#2a3978);color:#fff;box-shadow:none}
.mg .s{background:#16403a;opacity:1}.mg .x{background:#5a2432;opacity:1}
.grid .card:nth-child(n+5){animation-delay:.28s}
body{background-attachment:scroll!important}
.panel,button.ghost,.acct{backdrop-filter:none!important}
.pl::before,.pl::after{animation:none!important;opacity:0}
.rw canvas,.slt b{will-change:transform}
canvas.sn{transform:translateZ(0)}

.rl{width:min(320px,100%);margin:6px auto 0}.rl canvas{width:100%;display:block;border-radius:50%;box-shadow:0 14px 34px rgba(0,0,0,.55)}
.hs{display:flex;gap:6px;justify-content:center;margin:12px 0 4px;min-height:26px;flex-wrap:wrap}
.hs i{width:26px;height:26px;border-radius:50%;font-style:normal;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff;border:2px solid rgba(255,255,255,.6)}
.chs{display:flex;justify-content:center;gap:12px;margin:14px 0 10px}
.ch{width:56px;height:56px;border-radius:50%;padding:0;border:4px dashed rgba(255,255,255,.9);background:var(--c);color:#fff;font-size:15px;font-weight:800;box-shadow:inset 0 0 0 3px var(--c),0 5px 0 rgba(0,0,0,.35)}
.ch.on,.ch.on:hover{transform:translateY(-8px) scale(1.12)!important;box-shadow:inset 0 0 0 3px var(--c),0 12px 18px rgba(0,0,0,.5),0 0 18px var(--c)}
.rt,.ro{display:grid;gap:3px;background:linear-gradient(#0b6b3a,#084d2a);border:3px solid #c9a24b;padding:6px;max-width:380px;margin:0 auto;box-shadow:inset 0 0 30px rgba(0,0,0,.35),0 10px 24px rgba(0,0,0,.4)}
.rt{grid-template-columns:36px repeat(3,1fr);border-radius:14px 14px 0 0}.ro{grid-template-columns:repeat(6,1fr);border-radius:0 0 14px 14px;border-top:0}
.rt>div,.ro>div{position:relative;display:flex;align-items:center;justify-content:center;min-height:38px;border:1px solid rgba(255,255,255,.45);border-radius:6px;color:#fff;font-weight:800;font-size:14px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.rt>div:empty{border:0;cursor:default}
.rt .r,.ro .r{background:#c8283a}.rt .b,.ro .b{background:#161616}.rt .g{background:#1f9d55;grid-column:1/-1}.rt .o,.ro .o{background:rgba(255,255,255,.06);font-size:12px}
.rt .d{writing-mode:vertical-rl;transform:rotate(180deg);grid-row:span 4}
.rt>div:active,.ro>div:active{filter:brightness(1.35)}
.rt .hit{animation:rh .6s ease-in-out infinite alternate;z-index:2;border-color:#ffe08a}
@keyframes rh{to{box-shadow:0 0 18px #ffc857,inset 0 0 14px #ffc857}}
.cp{position:absolute;writing-mode:horizontal-tb;width:30px;height:30px;border-radius:50%;background:var(--c);border:3px dashed rgba(255,255,255,.9);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 6px rgba(0,0,0,.55);pointer-events:none;text-decoration:none;animation:cpd .18s}
.d .cp{transform:rotate(180deg);animation:none}
@keyframes cpd{from{transform:translateY(-18px) scale(1.4);opacity:0}}
.bq{margin-top:8px}.bq>*{flex:1}

.g48{display:block!important;position:relative;aspect-ratio:1;padding:0!important;touch-action:none}
.g48 .bc,.g48 .tl{position:absolute;left:0;top:0;aspect-ratio:auto;background:none;font-size:inherit}
.g48 .bc{border-radius:11px;background:rgba(255,255,255,.06)}
.g48 .tl{display:block;transition:transform .11s ease-out;will-change:transform}
.tl b{display:flex;width:100%;height:100%;align-items:center;justify-content:center;border-radius:11px;font-weight:800;color:#1d2b53;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.tl b.sp{animation:sp .2s ease-out}.tl b.pop{animation:pp .18s ease-out}
@keyframes sp{from{transform:scale(.3);opacity:0}}@keyframes pp{50%{transform:scale(1.18)}}
.slt b{display:block!important;overflow:hidden;position:relative}
.slt b.spn{animation:none!important;filter:blur(.8px)}
.st{will-change:transform}.st s{display:block;height:96px;line-height:96px;text-align:center;text-decoration:none}
.s-bdg{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:99px;background:var(--bad);color:#fff;font-size:12px;line-height:18px;font-style:normal;text-align:center;vertical-align:middle}
.s-sub{display:flex;gap:6px;margin-bottom:12px}.s-sub button{flex:1;padding:8px 4px;font-size:14px;background:var(--panel);color:var(--mut);border:1px solid var(--line)}.s-sub button.on{background:var(--acc);color:#1d2b53;border-color:var(--acc)}
.s-row{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer}.s-row.n{cursor:default}
.s-i{flex:1;min-width:0}.s-i b{display:block;font-size:16px}.s-i small{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-row button{flex:none;padding:7px 11px;font-size:14px}.s-rk{width:30px;text-align:center;color:var(--mut);font-weight:bold;flex:none}
.s-dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#55608a;flex:none}.s-dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.s-chat{display:flex;flex-direction:column;gap:6px;height:min(52vh,420px);overflow-y:auto;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.2)}
.s-msg{max-width:80%;padding:7px 11px;border-radius:14px;background:#243263;overflow-wrap:anywhere;font-size:15px;align-self:flex-start}.s-msg.me{align-self:flex-end;background:var(--acc);color:#1d2b53}
.s-msg small{display:block;font-size:11px;opacity:.65;margin-top:2px;text-align:right}
.s-send{display:flex;gap:8px;margin-top:10px}.s-send input{flex:1}.s-send button{flex:none}
.s-toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:60;max-width:92vw;padding:10px 16px;border-radius:12px;background:#243263;border:1px solid var(--acc);color:var(--ink);box-shadow:0 6px 20px rgba(0,0,0,.45);cursor:pointer;font-size:15px}
.s-empty{color:var(--mut);text-align:center;padding:18px 6px;font-size:14px}
.pbar{display:flex;gap:8px;margin:0 0 12px}
.pc{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.pc>i{font-style:normal;font-size:22px;flex:none}
.pc small{display:block;font-size:11px;color:var(--mut);line-height:1.3}
.pc b{display:inline-block;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:380px){.pc{padding:7px 9px;gap:7px}.pc b{font-size:15px}}
</style>

<body>
<main>
  <h1><svg width="46" height="30" viewBox="0 0 46 30" aria-hidden="true"><path d="M8 13 1 5v16z" fill="#e8836b"/><ellipse cx="26" cy="13" rx="18" ry="9" fill="#fdf3e3"/><rect x="24" y="5" width="4" height="16" fill="#ffc857"/><rect x="22" y="22" width="9" height="4" rx="1" fill="#ffc857"/></svg>Oyun Merkezi</h1>
  <div id="acct"></div>
  <div class="tabs" id="tabs" role="tablist" hidden>
    <button class="tab on" id="t-oyun">Oyunlar</button>
    <button class="tab" id="t-kumar">Kumar</button>
    <button class="tab" id="t-sosyal">👥 Sosyal<i class="s-bdg" id="sbdg" hidden></i></button>
  </div>
  <div id="view"></div>
  <p class="note">Puanlar tamamen sanaldır, gerçek para içermez. Hesaplar otomatik kaydedilir. <span id="ver"></span></p>
</main>

<script>
(function(){
var $=function(s,r){return (r||document).querySelector(s)};
var view=$('#view'),stop=null,tab='oyun';
/* BULUT AYARI: Firebase Realtime Database adresini buraya yaz (örn. 'https://proje-adi-default-rtdb.firebaseio.com').
   Boş bırakırsan hesaplar sadece bu tarayıcıda saklanır. Doluysa hesaplar sunucuda tutulur ve dosya adı/cihaz değişse de çalışır. */
var CLOUD_URL='https://a-oyun-merkezi-default-rtdb.firebaseio.com';
var KEY='oyunmerkezi:v1',START=1000,VER='1.3',db,me=null,meKey=null,bal=0;
/* Hesaplar tek bir kayıt altında tutulur. Güncellemede bu anahtar değişmediği ve
   load() eksik alanları tamamladığı için hesaplar ve bakiyeler korunur. */
function norm(d){
  if(!d||typeof d!=='object')d={};
  if(!d.users||typeof d.users!=='object')d.users={};
  if(!d.schema)d.schema=1;
  /* gelecekteki sürümler için: if(d.schema<2){ ...dönüştür...; d.schema=2 } */
  Object.keys(d.users).forEach(function(k){var u=d.users[k];if(typeof u.bal!=='number'||u.bal<0)u.bal=START;if(typeof u.playMs!=='number'||u.playMs<0)u.playMs=0;if(!u.stats)u.stats={}});
  try{var lg=parseInt(localStorage.getItem('om-bal'),10);if(lg>=0&&d.legacy===undefined)d.legacy=lg}catch(e){}
  return d;
}
function persist(){db.ts=Date.now();var j=JSON.stringify(db);try{localStorage.setItem(KEY,j)}catch(e){}idbSet(j);if(me){cloudPush();SOC&&SOC.board()}}
function setBal(v){var d=Math.floor(v-bal);bal=v;if(me){me.bal=bal;me.ts=Date.now();persist()}var bs=document.querySelectorAll('.bv');
  if(bs.length){Array.prototype.forEach.call(bs,function(x){x.textContent=Math.floor(bal)});if(d){var b=bs[bs.length-1];
    Array.prototype.forEach.call(bs,function(x){x.classList.remove('bump');void x.offsetWidth;x.classList.add('bump')});
    var r=b.getBoundingClientRect(),f=document.createElement('span');f.className='fl '+(d>0?'up':'dn');f.textContent=(d>0?'+':'')+d;
    f.style.left=(r.right+8)+'px';f.style.top=r.top+'px';document.body.appendChild(f);setTimeout(function(){f.remove()},1000)}}}
/* ---- Oyunda geçen süre: bir oyun açıkken ve sekme görünürken sayılır ---- */
function fmt(ms){var s=Math.floor((ms||0)/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+' sa '+m+' dk':m?m+' dk '+(s%60)+' sn':s+' sn'}
var pLast=Date.now(),pDirty=0;
function paint(){var t=$('#pt');if(t&&me)t.textContent=fmt(me.playMs);Array.prototype.forEach.call(document.querySelectorAll('.bv'),function(x){x.textContent=Math.floor(bal)})}
function flushPlay(){if(me&&pDirty){pDirty=0;persist()}}
function tickPlay(){var n=Date.now(),dt=n-pLast;pLast=n;
  if(me&&!document.hidden&&document.body.classList.contains('pl')&&dt>0&&dt<5000){me.playMs=(me.playMs||0)+dt;pDirty+=dt;var t=$('#pt');if(t)t.textContent=fmt(me.playMs);if(pDirty>=15000)flushPlay()}}
setInterval(tickPlay,1000);
document.addEventListener('visibilitychange',function(){pLast=Date.now();if(document.hidden)flushPlay()});
addEventListener('pagehide',flushPlay);
function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2)}).join('')}
function hash(str){
  if(window.crypto&&crypto.subtle)return crypto.subtle.digest('SHA-256',new TextEncoder().encode('om:'+str)).then(hex);
  var h=5381;for(var i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return Promise.resolve('x'+h);
}

/* ---- Kalıcı depolama: localStorage + IndexedDB (+ isteğe bağlı bulut) ---- */
var idb=null;
function idbOpen(){return idb||(idb=new Promise(function(res){try{var r=indexedDB.open('oyunmerkezi',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){res(r.result)};r.onerror=function(){res(null)}}catch(e){res(null)}}))}
function idbGet(){return idbOpen().then(function(d){return d?new Promise(function(res){try{var q=d.transaction('kv').objectStore('kv').get(KEY);q.onsuccess=function(){res(q.result||null)};q.onerror=function(){res(null)}}catch(e){res(null)}}):null})}
function idbSet(v){idbOpen().then(function(d){if(d)try{d.transaction('kv','readwrite').objectStore('kv').put(v,KEY)}catch(e){}})}
function wait(ms,v){return new Promise(function(r){setTimeout(r,ms,v)})}
function parse(j){try{return j?norm(JSON.parse(j)):null}catch(e){return null}}
function fixU(u){if(typeof u.bal!=='number'||u.bal<0)u.bal=START;if(typeof u.playMs!=='number'||u.playMs<0)u.playMs=0;if(!u.stats)u.stats={};return u}
var hold=false,ct=0;
function cloudURL(k){return CLOUD_URL.replace(/\/$/,'')+'/users/'+encodeURIComponent(k)+'.json'}
function cloudGet(k){if(!CLOUD_URL)return Promise.resolve(null);return fetch(cloudURL(k)).then(function(r){return r.ok?r.json():null}).catch(function(){return null})}
function cloudStat(t){var s=$('#cl');if(s)s.textContent=t}
function cloudPush(){
  if(!CLOUD_URL||!me||hold)return;clearTimeout(ct);var k=meKey,u=me;
  ct=setTimeout(function(){cloudStat('☁ kaydediliyor');
    fetch(cloudURL(k),{method:'PUT',body:JSON.stringify(u)}).then(function(r){cloudStat(r.ok?'☁ kayıtlı':'☁ bağlanamadı')}).catch(function(){cloudStat('☁ bağlanamadı')})},700);
}
function boot(){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  var l=null;try{l=localStorage.getItem(KEY)}catch(e){}
  Promise.race([idbGet(),wait(1500,null)]).then(function(i){
    var c=[parse(l),parse(i)].filter(Boolean).sort(function(a,b){return (b.ts||0)-(a.ts||0)});
    db=c[0]||norm(null);
    c.slice(1).forEach(function(o){Object.keys(o.users).forEach(function(k){if(!db.users[k])db.users[k]=o.users[k]});if(!db.last&&o.last)db.last=o.last});
    persist();
    (db.last&&db.users[db.last])?enter(db.last):loginView();
  });
}

function rnd(){return crypto.getRandomValues(new Uint32Array(1))[0]/4294967296}
function ri(n){return Math.floor(rnd()*n)}
var still=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
var fx=document.createElement('canvas');fx.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50';document.body.appendChild(fx);
var fc=fx.getContext('2d'),ps=[],fr=0;
function fit(){fx.width=innerWidth;fx.height=innerHeight}fit();addEventListener('resize',fit);
function burst(x,y,n){
  if(still)return;x=x==null?innerWidth/2:x;y=y==null?innerHeight*.35:y;var cols=['#ffc857','#7be0a4','#ff6b6b','#8ecbff','#fdf3e3'];
  for(var i=0;i<(n||44);i++){var a=rnd()*6.28,v=2+rnd()*6;ps.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,l:1,c:cols[ri(5)],s:3+rnd()*4})}
  if(!fr)fr=requestAnimationFrame(fxl);
}
function fxl(){
  fc.clearRect(0,0,fx.width,fx.height);
  ps=ps.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.vx*=.99;p.l-=.016;if(p.l<=0)return false;fc.globalAlpha=p.l;fc.fillStyle=p.c;fc.fillRect(p.x,p.y,p.s,p.s);return true});
  fc.globalAlpha=1;fr=ps.length?requestAnimationFrame(fxl):0;
}
document.addEventListener('pointerdown',function(e){
  var b=e.target.closest&&e.target.closest('button');if(!b||b.disabled)return;
  var r=b.getBoundingClientRect(),s=document.createElement('span'),d=Math.max(r.width,r.height)*1.6;s.className='rip';
  s.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';
  b.appendChild(s);setTimeout(function(){s.remove()},600);
});

var NORMAL=[
 {id:'yilan',i:'🐍',n:'Yılan',d:'Yem ye, uzayıp git'},
 {id:'hafiza',i:'🃏',n:'Hafıza',d:'Eşleri bul'},
 {id:'refleks',i:'⚡',n:'Refleks',d:'Yeşil olunca tıkla'},
 {id:'xox',i:'❌',n:'XOX',d:'Bilgisayara karşı'}
];
var KUMAR=[
 {id:'zeplin',i:'🎈',n:'Zeplin',d:'Patlamadan önce çek'},
 {id:'yazitura',i:'🪙',n:'Yazı Tura',d:'Kazanç 1.94x'},
 {id:'zar',i:'🎲',n:'Zar',d:'Kendi oranını seç'},
 {id:'oda',i:'🏠',n:'Online Oda',d:'En fazla 4 kişi'}
];

function mergeIn(d){var n=0;if(!d||!d.users)return 0;
  Object.keys(d.users).forEach(function(k){var u=d.users[k];if(!u||!u.h)return;
    if(!db.users[k]||(u.ts||0)>(db.users[k].ts||0)){var pm=(db.users[k]&&db.users[k].playMs)||0;db.users[k]=fixU(u);db.users[k].playMs=Math.max(db.users[k].playMs,pm);n++}});
  if(!db.last&&d.last&&db.users[d.last])db.last=d.last;persist();return n}
function toCode(){return btoa(unescape(encodeURIComponent(JSON.stringify({users:db.users,last:db.last}))))}
function fromCode(c){return JSON.parse(decodeURIComponent(escape(atob(c.replace(/\s+/g,'')))))}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function loginView(msg){
  SOC&&SOC.stop();
  if(stop){stop();stop=null}
  $('#tabs').hidden=true;$('#acct').innerHTML='';
  view.innerHTML='<div class="panel"><h2>Hesabına gir</h2><div class="row"><label>Kullanıcı adı<input type="text" id="un" maxlength="16" autocomplete="username"></label><label>Şifre<input type="password" id="pw" autocomplete="current-password"></label></div>'+
   '<div class="row"><button id="li">Giriş yap</button><button id="rg" class="ghost">Hesap oluştur</button></div><div class="msg" id="lmsg">'+(msg||'')+'</div>'+
   '<div class="row"><label>Yedekten hesap yükle<input type="file" id="imp" accept=".json,application/json"></label></div>'+
   '<div class="row"><label>Hesap kodu ile yükle<input type="text" id="cod" placeholder="Eski sürümden kopyaladığın kodu yapıştır"></label><button id="codb" class="ghost">Yükle</button></div></div>';
  function creds(){var n=$('#un').value.trim();return {n:n,k:n.toLowerCase(),p:$('#pw').value}}
  $('#li').onclick=function(){var c=creds();
    if(!c.n){$('#lmsg').textContent='Kullanıcı adını yaz.';return}
    hash(c.p).then(function(h){
      function ok(a){h===a.h?enter(c.k):$('#lmsg').textContent='Şifre yanlış.'}
      if(db.users[c.k])return ok(db.users[c.k]);
      $('#lmsg').textContent='Hesap aranıyor...';
      cloudGet(c.k).then(function(cu){if(cu&&cu.h){db.users[c.k]=fixU(cu);ok(db.users[c.k])}else $('#lmsg').textContent='Bu adla hesap yok.'})})};
  $('#rg').onclick=function(){var c=creds();
    if(!/^[\w\u00c0-\u024f-]{2,16}$/.test(c.n)){$('#lmsg').textContent='Kullanıcı adı 2 ile 16 karakter olmalı; sadece harf, rakam, _ ve - kullan.';return}
    if(c.p.length<4){$('#lmsg').textContent='Şifre en az 4 karakter olmalı.';return}
    if(db.users[c.k]){$('#lmsg').textContent='Bu ad alınmış.';return}
    hash(c.p).then(function(h){cloudGet(c.k).then(function(cu){
      if(cu){$('#lmsg').textContent='Bu ad alınmış.';return}
      var start=START;if(db.legacy>=0){start=db.legacy;delete db.legacy}
      db.users[c.k]={name:c.n,h:h,bal:start,playMs:0,created:Date.now(),ts:Date.now(),stats:{}};persist();enter(c.k)})})};
  function done(n){var u=Object.keys(db.users);
    if(n&&db.last&&db.users[db.last])enter(db.last);else if(n&&u.length===1)enter(u[0]);
    else loginView(n?n+' hesap yüklendi. Şimdi giriş yapabilirsin.':'Yeni hesap bulunamadı.')}
  $('#imp').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){try{done(mergeIn(JSON.parse(r.result)))}catch(x){$('#lmsg').textContent='Yedek dosyası okunamadı.'}};
    r.readAsText(f)};
  $('#codb').onclick=function(){try{done(mergeIn(fromCode($('#cod').value)))}catch(x){$('#lmsg').textContent='Kod geçersiz.'}};
}
function enter(k){
  hold=!!CLOUD_URL;meKey=k;me=db.users[k];bal=me.bal;db.last=k;persist();
  $('#tabs').hidden=false;
  $('#acct').innerHTML='<div class="acct"><span>👤 <b>'+esc(me.name)+'</b> <small id="cl" style="color:var(--mut)"></small></span><button class="ghost" id="bk">Yedek al</button><button class="ghost" id="kd">Kodu kopyala</button><button class="ghost" id="lo2">Çıkış</button></div>'+
   '<div class="pbar"><div class="pc"><i>🪙</i><div><small>Hesap bakiyesi</small><b class="bv">'+Math.floor(bal)+'</b></div></div><div class="pc"><i>⏱️</i><div><small>Toplam oyun süresi</small><b id="pt">'+fmt(me.playMs)+'</b></div></div></div>';
  $('#bk').onclick=function(){var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));
    a.download='oyun-merkezi-yedek.json';a.click()};
  $('#kd').onclick=function(){var c=toCode(),b=$('#kd');
    function ok(){b.textContent='Kopyalandı ✓';setTimeout(function(){b.textContent='Kodu kopyala'},1500)}
    try{navigator.clipboard.writeText(c).then(ok,function(){prompt('Kodu kopyala:',c)})}catch(e){prompt('Kodu kopyala:',c)}};
  $('#lo2').onclick=function(){flushPlay();SOC&&SOC.stop();db.last=null;me=null;meKey=null;persist();loginView()};
  Promise.race([cloudGet(k),wait(1500,false)]).then(function(cu){
    hold=false;
    if(cu&&cu.h===me.h)me.playMs=Math.max(me.playMs||0,cu.playMs||0);
    if(cu&&cu.h===me.h&&(cu.ts||0)>(me.ts||0)){me.bal=cu.bal;me.ts=cu.ts;bal=me.bal;persist()}else cloudPush();
    paint();
    if(meKey===k){SOC&&SOC.start();show()}
  });
}

function show(){
  flushPlay();document.body.classList.remove('pl');if(stop){stop();stop=null}
  $('#t-oyun').className='tab'+(tab==='oyun'?' on':'');
  $('#t-kumar').className='tab'+(tab==='kumar'?' on':'');
  $('#t-sosyal').className='tab'+(tab==='sosyal'?' on':'');
  if(tab==='sosyal'){stop=SOC.view();return}
  var list=tab==='oyun'?NORMAL:KUMAR;
  view.innerHTML='<div class="grid '+(tab==='kumar'?'k':'')+'">'+list.map(function(g){
    return '<button class="card" data-g="'+g.id+'"><i>'+g.i+'</i><b>'+g.n+'</b><span>'+g.d+'</span></button>'}).join('')+'</div>';
  view.querySelectorAll('.card').forEach(function(c){c.onclick=function(){open(c.dataset.g)}});
}
function open(id){
  var all=NORMAL.concat(KUMAR),g=all.filter(function(x){return x.id===id})[0];
  var isK=KUMAR.indexOf(g)>=0;
  view.innerHTML='<div class="top"><button class="ghost" id="back">← Geri</button><h2>'+g.n+'</h2><span>'+(isK?'Bakiye: <b class="bv">'+Math.floor(bal)+'</b>':'')+'</span></div><div id="game"></div>';
  document.body.classList.add('pl');$('#back').onclick=show;
  stop=G[id]($('#game'))||null;
}
$('#t-oyun').onclick=function(){tab='oyun';show()};
$('#t-kumar').onclick=function(){tab='kumar';show()};
$('#t-sosyal').onclick=function(){SOC.home();tab='sosyal';show()};

/* ===== SOSYAL: arkadaşlık, sohbet, sıralama (Firebase REST) ===== */
var SOC=(function(){
var DB=CLOUD_URL.replace(/\/$/,''),E=encodeURIComponent,STS={'.sv':'timestamp'},off=0,on=false,fr={},rq={},ib={},pr={},seen={},first=true,sub='fr',chat=null,msgs=[],lastKey='',tT=0,hT=0,cT=0,bT=0,lt={},sending=false;
function now(){return Date.now()+off}
function get(p,q){return fetch(DB+'/'+p+'.json'+(q?'?'+q:'')).then(function(r){return r.ok?r.json():undefined}).catch(function(){return undefined})}
function wr(m,p,b){return fetch(DB+'/'+p+'.json',{method:m,body:JSON.stringify(b)}).then(function(r){return r.ok}).catch(function(){return false})}
function ls(){try{seen=JSON.parse(localStorage.getItem('om-seen:'+meKey)||'{}')||{}}catch(e){seen={}}}
function ss(){try{localStorage.setItem('om-seen:'+meKey,JSON.stringify(seen))}catch(e){}}
function nm(k){return (fr[k]&&fr[k].name)||k}
function isOn(k){var t=pr[k];return t&&now()-t<75000?1:0}
function unread(k){var m=ib[k];return m&&m.f!==meKey&&(m.ts||0)>(seen[k]||0)?1:0}
function ago(t){var m=Math.floor((now()-t)/60000);return m<1?'az önce':m<60?m+' dk önce':m<1440?Math.floor(m/60)+' sa önce':Math.floor(m/1440)+' gün önce'}
function hm(t){return t?new Date(t).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):''}
function pair(k){return [meKey,k].sort().join('~')}
function sync(){wr('PUT','presence/'+E(meKey),STS).then(function(){return get('presence/'+E(meKey))}).then(function(t){if(typeof t==='number')off=t-Date.now()})}
function beat(){if(on&&!document.hidden)wr('PUT','presence/'+E(meKey),STS)}
function board(){if(!on)return;clearTimeout(bT);bT=setTimeout(function(){if(me)wr('PUT','board/'+E(meKey),{name:me.name,bal:Math.floor(me.bal),ts:STS})},2500)}
function badge(){var n=Object.keys(ib).filter(function(k){return fr[k]&&unread(k)}).length+Object.keys(rq).length,b=$('#sbdg');if(b){b.hidden=!n;b.textContent=n>9?'9+':n}}
function toast(t,k,s){var o=$('.s-toast');if(o)o.remove();var d=document.createElement('div');d.className='s-toast';d.setAttribute('role','status');d.textContent=t.slice(0,90);
  d.onclick=function(){d.remove();tab='sosyal';chat=k||null;if(s)sub=s;show()};document.body.appendChild(d);setTimeout(function(){d.remove()},5000)}
function notify(){Object.keys(ib).forEach(function(k){var m=ib[k];if(!fr[k]||!m||m.f===meKey)return;var t=m.ts||0;
    if(t>(lt['m'+k]||0)){if(!first&&t>(seen[k]||0)&&!(tab==='sosyal'&&chat===k))toast('💬 '+nm(k)+': '+m.t,k);lt['m'+k]=t}});

    $('#pls').innerHTML=ks.map(function(k){var p=pl[k],has=p.r===r.rd,b=Math.floor(+p.b||0),w=res&&(res>3?'h':'l')===p.p,
      s=!has?'Bahis bekleniyor':res?(p.p==='h'?'Yüksek':'Düşük')+' · '+b+' → '+(w?'+'+Math.floor(b*1.94)+' 🎉':'-'+b):'Bahis hazır ✓';
      return '<div class="s-row n"><span class="s-dot'+(has?' on':'')+'"></span><div class="s-i"><b>'+esc(p.n||k)+(k===r.host?' 👑':'')+(k===meKey?' (sen)':'')+'</b><small>'+s+'</small></div></div>'}).join('');
    $('#bz').hidden=!(r.st==='bet'&&!(mine&&mine.rd===r.rd));
    $('#go').hidden=!(r.host===meKey&&r.st==='bet'&&bt>0)}
  function leave(){var id=rid;if(!id)return;rid=null;clearInterval(t);if(R)settle(R);refund();
    api('DELETE',R&&R.host===meKey?'rooms/'+id:'rooms/'+id+'/pl/'+E(meKey));R=null}
  lobby();
  return function(){leave();clearInterval(t)};
};

$('#ver').textContent='Sürüm '+VER;
/* Güncelleme denetimi: sunucudaki sürüm farklıysa "yenile" çubuğu çıkar. Yeni sürümde VER değerini artırmayı unutma. */
function chkVer(){if(location.protocol==='file:')return;
  fetch(location.pathname+'?c='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(t){
    var m=/VER='([^']+)'/.exec(t);if(!m||m[1]===VER||$('#upd'))return;
    var d=document.createElement('div');d.id='upd';d.setAttribute('role','status');d.textContent='🔄 Yeni sürüm var ('+m[1]+') - güncellemek için dokun';
    d.style.cssText='position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:70;max-width:92vw;background:#ffc857;color:#1d2b53;padding:11px 16px;border-radius:12px;font-weight:bold;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.4);text-align:center';
    d.onclick=function(){location.href=location.pathname+'?u='+Date.now()};document.body.appendChild(d)}).catch(function(){})}
setTimeout(chkVer,2000);setInterval(chkVer,60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)chkVer()});
boot();
})();
</script>
