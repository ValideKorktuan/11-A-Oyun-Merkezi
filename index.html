<script>
(function(){
var $=function(s,r){return (r||document).querySelector(s)};
var view=$('#view'),stop=null,tab='oyun';
/* BULUT AYARI: Firebase Realtime Database adresini buraya yaz (örn. 'https://proje-adi-default-rtdb.firebaseio.com').
   Boş bırakırsan hesaplar sadece bu tarayıcıda saklanır. Doluysa hesaplar sunucuda tutulur ve dosya adı/cihaz değişse de çalışır. */
var CLOUD_URL='https://a-oyun-merkezi-default-rtdb.firebaseio.com';
var KEY='oyunmerkezi:v1',START=1000,VER='3.0',db,me=null,meKey=null,bal=0;
/* Hesaplar tek bir kayıt altında tutulur. Güncellemede bu anahtar değişmediği ve
   load() eksik alanları tamamladığı için hesaplar ve bakiyeler korunur. */
function norm(d){
  if(!d||typeof d!=='object')d={};
  if(!d.users||typeof d.users!=='object')d.users={};
  if(!d.schema)d.schema=1;
  /* gelecekteki sürümler için: if(d.schema<2){ ...dönüştür...; d.schema=2 } */
  Object.keys(d.users).forEach(function(k){var u=d.users[k];if(typeof u.bal!=='number'||u.bal<0)u.bal=START;if(typeof u.playMs!=='number'||u.playMs<0)u.playMs=0;if(!u.stats)u.stats={}});
  try{var lg=parseInt(localStorage.getItem('om-bal'),10);if(lg>=0&&d.legacy===undefined)d.legacy=lg}catch(e){}
  return d;
}
function persist(){db.ts=Date.now();var j=JSON.stringify(db);try{localStorage.setItem(KEY,j)}catch(e){}idbSet(j);if(me){cloudPush();SOC&&SOC.board()}}
function setBal(v){var d=Math.floor(v-bal);bal=v;if(me){me.bal=bal;me.ts=Date.now();persist()}var bs=document.querySelectorAll('.bv');
  if(bs.length){Array.prototype.forEach.call(bs,function(x){x.textContent=Math.floor(bal)});if(d){var b=bs[bs.length-1];
    Array.prototype.forEach.call(bs,function(x){x.classList.remove('bump');void x.offsetWidth;x.classList.add('bump')});
    var r=b.getBoundingClientRect(),f=document.createElement('span');f.className='fl '+(d>0?'up':'dn');f.textContent=(d>0?'+':'')+d;
    f.style.left=(r.right+8)+'px';f.style.top=r.top+'px';document.body.appendChild(f);setTimeout(function(){f.remove()},1000)}}}
/* ---- Oyunda geçen süre: bir oyun açıkken ve sekme görünürken sayılır ---- */
function fmt(ms){var s=Math.floor((ms||0)/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+' sa '+m+' dk':m?m+' dk '+(s%60)+' sn':s+' sn'}
var pLast=Date.now(),pDirty=0;
function paint(){var t=$('#pt');if(t&&me)t.textContent=fmt(me.playMs);Array.prototype.forEach.call(document.querySelectorAll('.bv'),function(x){x.textContent=Math.floor(bal)})}
function flushPlay(){if(me&&pDirty){pDirty=0;persist()}}
function tickPlay(){var n=Date.now(),dt=n-pLast;pLast=n;
  if(me&&!document.hidden&&document.body.classList.contains('pl')&&dt>0&&dt<5000){me.playMs=(me.playMs||0)+dt;pDirty+=dt;var t=$('#pt');if(t)t.textContent=fmt(me.playMs);if(pDirty>=15000)flushPlay()}}
setInterval(tickPlay,1000);
document.addEventListener('visibilitychange',function(){pLast=Date.now();if(document.hidden)flushPlay()});
addEventListener('pagehide',flushPlay);
/* Zeplin patlama noktası: P(x'e ulaşma) = 0.97/(x-0.1); en az 1.07x, en çok 1000x. Erken patlamayı azaltmak için 0.1 değerini büyüt. */
function crashPt(){return Math.min(1000,Math.floor(100*(0.1+0.97/(1-rnd())))/100)}
function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2)}).join('')}
function hash(str){
  if(window.crypto&&crypto.subtle)return crypto.subtle.digest('SHA-256',new TextEncoder().encode('om:'+str)).then(hex);
  var h=5381;for(var i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return Promise.resolve('x'+h);
}

/* ---- Kalıcı depolama: localStorage + IndexedDB (+ isteğe bağlı bulut) ---- */
var idb=null;
function idbOpen(){return idb||(idb=new Promise(function(res){try{var r=indexedDB.open('oyunmerkezi',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){res(r.result)};r.onerror=function(){res(null)}}catch(e){res(null)}}))}
function idbGet(){return idbOpen().then(function(d){return d?new Promise(function(res){try{var q=d.transaction('kv').objectStore('kv').get(KEY);q.onsuccess=function(){res(q.result||null)};q.onerror=function(){res(null)}}catch(e){res(null)}}):null})}
function idbSet(v){idbOpen().then(function(d){if(d)try{d.transaction('kv','readwrite').objectStore('kv').put(v,KEY)}catch(e){}})}
function wait(ms,v){return new Promise(function(r){setTimeout(r,ms,v)})}
function parse(j){try{return j?norm(JSON.parse(j)):null}catch(e){return null}}
function fixU(u){if(typeof u.bal!=='number'||u.bal<0)u.bal=START;if(typeof u.playMs!=='number'||u.playMs<0)u.playMs=0;if(!u.stats)u.stats={};return u}
var hold=false,ct=0;
function cloudURL(k){return CLOUD_URL.replace(/\/$/,'')+'/users/'+encodeURIComponent(k)+'.json'}
function cloudGet(k){if(!CLOUD_URL)return Promise.resolve(null);return fetch(cloudURL(k)).then(function(r){return r.ok?r.json():null}).catch(function(){return null})}
function cloudStat(t){var s=$('#cl');if(s)s.textContent=t}
function cloudPush(){
  if(!CLOUD_URL||!me||hold)return;clearTimeout(ct);var k=meKey,u=me;
  ct=setTimeout(function(){cloudStat('☁ kaydediliyor');
    fetch(cloudURL(k),{method:'PUT',body:JSON.stringify(u)}).then(function(r){cloudStat(r.ok?'☁ kayıtlı':'☁ bağlanamadı')}).catch(function(){cloudStat('☁ bağlanamadı')})},700);

function boot(){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  var l=null;try{l=localStorage.getItem(KEY)}catch(e){}
  Promise.race([idbGet(),wait(1500,null)]).then(function(i){
    var c=[parse(l),parse(i)].filter(Boolean).sort(function(a,b){return (b.ts||0)-(a.ts||0)});
    db=c[0]||norm(null);
    c.slice(1).forEach(function(o){Object.keys(o.users).forEach(function(k){if(!db.users[k])db.users[k]=o.users[k]});if(!db.last&&o.last)db.last=o.last});
    persist();
    (db.last&&db.users[db.last])?enter(db.last):loginView();
  });
}

function rnd(){return crypto.getRandomValues(new Uint32Array(1))[0]/4294967296}
function ri(n){return Math.floor(rnd()*n)}
var still=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
var fx=document.createElement('canvas');fx.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50';document.body.appendChild(fx);
var fc=fx.getContext('2d'),fxp=[],fr=0;
function fit(){fx.width=innerWidth;fx.height=innerHeight}fit();addEventListener('resize',fit);
function burst(x,y,n){
  if(still)return;x=x==null?innerWidth/2:x;y=y==null?innerHeight*.35:y;var cols=['#ffc857','#7be0a4','#ff6b6b','#8ecbff','#fdf3e3'];
  for(var i=0;i<(n||44);i++){var a=rnd()*6.28,v=2+rnd()*6;fxp.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,l:1,c:cols[ri(5)],s:3+rnd()*4})}
  if(!fr)fr=requestAnimationFrame(fxl);
}
function fxl(){
  fc.clearRect(0,0,fx.width,fx.height);
  fxp=fxp.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.vx*=.99;p.l-=.016;if(p.l<=0)return false;fc.globalAlpha=p.l;fc.fillStyle=p.c;fc.fillRect(p.x,p.y,p.s,p.s);return true});
  fc.globalAlpha=1;fr=fxp.length?requestAnimationFrame(fxl):0;
}

function mergeIn(d){var n=0;if(!d||!d.users)return 0;
  Object.keys(d.users).forEach(function(k){var u=d.users[k];if(!u||!u.h)return;
    if(!db.users[k]||(u.ts||0)>(db.users[k].ts||0)){var pm=(db.users[k]&&db.users[k].playMs)||0;db.users[k]=fixU(u);db.users[k].playMs=Math.max(db.users[k].playMs,pm);n++}});
  if(!db.last&&d.last&&db.users[d.last])db.last=d.last;persist();return n}
function toCode(){return btoa(unescape(encodeURIComponent(JSON.stringify({users:db.users,last:db.last}))))}
function fromCode(c){return JSON.parse(decodeURIComponent(escape(atob(c.replace(/\s+/g,'')))))}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function loginView(msg){
  SOC&&SOC.stop();
  if(stop){stop();stop=null}
  $('#tabs').hidden=true;$('#acct').innerHTML='';
  view.innerHTML='<div class="panel"><h2>Hesabına gir</h2><div class="row"><label>Kullanıcı adı<input type="text" id="un" maxlength="16" autocomplete="username"></label><label>Şifre<input type="password" id="pw" autocomplete="current-password"></label></div>'+
   '<div class="row"><button id="li">Giriş yap</button><button id="rg" class="ghost">Hesap oluştur</button></div><div class="msg" id="lmsg">'+(msg||'')+'</div>'+
   '<div class="row"><label>Yedekten hesap yükle<input type="file" id="imp" accept=".json,application/json"></label></div>'+
   '<div class="row"><label>Hesap kodu ile yükle<input type="text" id="cod" placeholder="Eski sürümden kopyaladığın kodu yapıştır"></label><button id="codb" class="ghost">Yükle</button></div></div>';
  function creds(){var n=$('#un').value.trim();return {n:n,k:n.toLowerCase(),p:$('#pw').value}}
  $('#li').onclick=function(){var c=creds();
    if(!c.n){$('#lmsg').textContent='Kullanıcı adını yaz.';return}
    hash(c.p).then(function(h){
      function ok(a){h===a.h?enter(c.k):$('#lmsg').textContent='Şifre yanlış.'}
      if(db.users[c.k])return ok(db.users[c.k]);
      $('#lmsg').textContent='Hesap aranıyor...';
      cloudGet(c.k).then(function(cu){if(cu&&cu.h){db.users[c.k]=fixU(cu);ok(db.users[c.k])}else $('#lmsg').textContent='Bu adla hesap yok.'})})};
  $('#rg').onclick=function(){var c=creds();
    if(!/^[\w\u00c0-\u024f-]{2,16}$/.test(c.n)){$('#lmsg').textContent='Kullanıcı adı 2 ile 16 karakter olmalı; sadece harf, rakam, _ ve - kullan.';return}
    if(c.p.length<4){$('#lmsg').textContent='Şifre en az 4 karakter olmalı.';return}
    if(db.users[c.k]){$('#lmsg').textContent='Bu ad alınmış.';return}
    hash(c.p).then(function(h){cloudGet(c.k).then(function(cu){
      if(cu){$('#lmsg').textContent='Bu ad alınmış.';return}
      var start=START;if(db.legacy>=0){start=db.legacy;delete db.legacy}
      db.users[c.k]={name:c.n,h:h,bal:start,playMs:0,created:Date.now(),ts:Date.now(),stats:{}};persist();fbapi('DELETE','bans/'+EC(c.k)).then(function(){enter(c.k)})})})};
  function done(n){var u=Object.keys(db.users);
    if(n&&db.last&&db.users[db.last])enter(db.last);else if(n&&u.length===1)enter(u[0]);
    else loginView(n?n+' hesap yüklendi. Şimdi giriş yapabilirsin.':'Yeni hesap bulunamadı.')}
  $('#imp').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){try{done(mergeIn(JSON.parse(r.result)))}catch(x){$('#lmsg').textContent='Yedek dosyası okunamadı.'}};
    r.readAsText(f)};
  $('#codb').onclick=function(){try{done(mergeIn(fromCode($('#cod').value)))}catch(x){$('#lmsg').textContent='Kod geçersiz.'}};

function enter(k){
  hold=!!CLOUD_URL;meKey=k;me=db.users[k];bal=me.bal;db.last=k;persist();
  $('#tabs').hidden=false;
  $('#acct').innerHTML='<div class="acct"><span style="display:inline-flex;align-items:center;gap:8px"><span id="acv" style="display:inline-flex;align-items:center;gap:8px;cursor:pointer"></span> <small id="cl" style="color:var(--mut)"></small></span><button class="ghost" id="bk">Yedek al</button><button class="ghost" id="kd">Kodu kopyala</button><button class="ghost" id="lo2">Çıkış</button></div>'+
   '<div class="pbar"><div class="pc"><i>🪙</i><div><small>Hesap bakiyesi</small><b class="bv">'+Math.floor(bal)+'</b></div></div><div class="pc"><i>⏱️</i><div><small>Toplam oyun süresi</small><b id="pt">'+fmt(me.playMs)+'</b></div></div></div>';
  paintAv();$('#acv').onclick=function(){tab='profil';show()};
  $('#bk').onclick=function(){var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));
    a.download='oyun-merkezi-yedek.json';a.click()};
  $('#kd').onclick=function(){var c=toCode(),b=$('#kd');
    function ok(){b.textContent='Kopyalandı ✓';setTimeout(function(){b.textContent='Kodu kopyala'},1500)}
    try{navigator.clipboard.writeText(c).then(ok,function(){prompt('Kodu kopyala:',c)})}catch(e){prompt('Kodu kopyala:',c)}};
  $('#lo2').onclick=function(){flushPlay();SOC&&SOC.stop();db.last=null;me=null;meKey=null;persist();loginView()};
  Promise.race([fbapi('GET','bans/'+EC(k)),wait(1500,undefined)]).then(function(b){
    if(b&&b.t==='del'){delAcct(k);return 'del'}
    return Promise.race([cloudGet(k),wait(1500,false)])}).then(function(cu){
    if(cu==='del')return;
    hold=false;
    if(cu&&cu.h===me.h)me.playMs=Math.max(me.playMs||0,cu.playMs||0);
    if(cu&&cu.h===me.h&&(cu.ts||0)>(me.ts||0)){me.bal=cu.bal;me.ts=cu.ts;bal=me.bal;persist()}else cloudPush();
    paint();mig();grantSync();
    if(meKey===k){SOC&&SOC.start();show();banChk()}
  });
}
